<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.png" type="image/x-icon">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | D & D</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <!-- Main Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Slideshow Styles -->
  <style>
    .slideshow {
      max-width: 900px;
      margin: 40px auto;
      border-radius: 20px;
      overflow: hidden;
    }


    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease, transform 1.2s ease;
      transform: scale(1.03);
      width: 100%;
      height: auto;
      display: block;
    }

    .slide.active {
      opacity: 1;
      transform: scale(1);
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 768px) {
      .slideshow {
        height: 320px;
      }
    }
  </style>
</head>
<body>

<!-- Navigation -->
<nav>
  <div class="logo">Deepshikha & Deepak</div>
  <ul>
    <li><a href="index.html" class="active">Home</a></li>
    <li><a href="our-story.html">Our Story</a></li>
    <li><a href="events.html">Events</a></li>
    <li><a href="dress-code.html">Dress Code</a></li>
    <li><a href="venue.html">Venue</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="contacts.html">Contacts</a></li>
  </ul>
</nav>

<!-- Page Content -->
<main class="container gallery-page">

  <h1>Gallery</h1>

  <img src="assets/motif.svg" alt="" class="motif">

  <p class="gallery-note">
    Moments from our journey — unfolding one memory at a time.
  </p>

  <!-- Upload Section -->
  <section class="upload-section">
    <p class="upload-text">
      Share your captured moments with us 💛
    </p>

    <a
      href="https://drive.google.com/drive/folders/1DLoI-LvtGlVqR0OEaVJBHrWMjuopYNuo?usp=sharing"
      target="_blank"
      class="upload-btn"
    >
      Upload Your Photos
    </a>
  </section>

  <!-- Slideshow -->
  <section class="slideshow" id="slideshow">
    <div class="slide active">
      <img src="assets/IMG_3920.JPG" alt="Memory 1">
    </div>
    <div class="slide">
      <img src="assets/IMG_3432.JPG" alt="Memory 2">
    </div>
    <div class="slide">
      <img src="assets/IMG_3936.JPG" alt="Memory 3">
    </div>
  </section>

</main>

<!-- Footer -->
<footer>
  <p>💛 Deepshikha & Deepak 💛</p>
  <p class="date">24th February 2026</p>
</footer>

<!-- Slideshow Script -->
<script>
  const slides = document.querySelectorAll(".slide");
  let currentIndex = 0;

  setInterval(() => {
    slides[currentIndex].classList.remove("active");
    currentIndex = (currentIndex + 1) % slides.length;
    slides[currentIndex].classList.add("active");
  }, 4000); // 4 seconds
</script>

</body>
</html>
